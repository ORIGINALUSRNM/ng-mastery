<header>
  <h1 class="center-text">Basic Angular Todo</h1>
</header>

<main>
  <section class="todo-input">
    <app-todo-input (todoAdded)="handleTodoAdded($event)"></app-todo-input>
  </section>
  <section class="todo-list"></section>
</main>

@for ((todo of todos$ | async); track todo.id ) {
<div>{{todo.description}}</div>
}
