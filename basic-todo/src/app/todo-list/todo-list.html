<div class="wrapper glow-border">
  @for ((todo of todos()); track todo.id ) {
  <div class="row space-between todo-item border-shadow">
    <div class="todo-description" [ngClass]="{ 'completed': todo.completed}">
      <label>
        <input type="checkbox" #checkbox [checked]="todo.completed"
          (change)="handleCompleteChange(todo.id, checkbox.checked)" />
        <span>{{todo.description}}</span>
      </label>
    </div>
    <button class="delete icon-btn" (click)="handleDeleteTodoClick(todo)">
      <i class="fa-solid fa-trash-can"></i>
    </button>
  </div>
  } @empty {
  <p class="empty"><em>Nothing to do yet</em></p>
  }
</div>
<div class="footer">
  @if(todos().length) {
  <div>{{remaining()}} {{remaining() === 1 ? 'item' : 'items' }} left</div>
  @if(completed() > 0) {
  <button class="delete-all icon-btn" (click)="handleDeleteAllCompleted()">
    Clear Completed ({{completed()}})
  </button>
  }
  }
</div>
